name: Release

# A pushed v<version> tag publishes every @foreman-kit package at that version (D0026, D0036).
# npm trusted publishing: npm trusts this workflow through GitHub's OIDC token, so no npm token is stored.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that runs the repo's code, with read access only. The tarballs it checks are the ones published.
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TEST_KIT_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/test_kit_test
      TEST_DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/demo_app_test
    steps:
      - name: Start Postgres
        run: >
          docker run -d --name pg -p 127.0.0.1:5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci
          postgres:16 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
          no-cache: true # a release never restores a cache another run could have written
      - run: bun install --frozen-lockfile
      - name: The tag matches the packages' version
        env:
          TAG: ${{ github.ref_name }}
        run: bun .github/scripts/release.ts tag "$TAG"
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do docker exec pg pg_isready -U ci >/dev/null 2>&1 && exit 0; sleep 1; done
          docker logs pg; exit 1
      - run: bun run check
      - name: Pack each package and check its contents
        run: bun .github/scripts/release.ts pack "$RUNNER_TEMP/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Only publishes the checked tarballs: no checkout, no install, no repo code runs with the OIDC token.
  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm # the trusted publisher on npmjs.com names this workflow and this environment
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # its npm is 11.x; trusted publishing needs npm 11.5.1 or later
          package-manager-cache: false
      - name: Publish (dependencies first, foreman last)
        run: |
          npm --version
          for pkg in docs-check test-kit design-kit foreman; do
            npm publish --provenance --access public ./dist/foreman-kit-"$pkg"-*.tgz
          done
